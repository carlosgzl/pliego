# Pliego — a static Vite build. There is no backend here on purpose: the
# books live in Alexandria's API (the PC) and in Alexandria's encrypted cloud
# store, and this site is the writing surface for both.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# A single-page app: every path has to reach index.html, or a reload on
# /#/Mi-libro would 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# El trabajador de servicio NO se guarda en caché.
#
# Es el archivo que decide qué se guarda y qué no; si el navegador se quedara
# con una copia vieja, un despliegue nuevo podría no llegar nunca. Se revalida
# siempre, que cuesta una petición condicional de nada.
[[headers]]
  for = "/sw.js"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"
    service-worker-allowed = "/"

# El manifest, con su tipo de verdad.
#
# Netlify lo sirve como `application/octet-stream`, y con ese tipo hay
# navegadores que sencillamente no ofrecen instalar la aplicación — que es todo
# el motivo de que exista este archivo.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    content-type = "application/manifest+json; charset=utf-8"
    cache-control = "public, max-age=3600"
